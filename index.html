  <style>
    #kms-preloader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #FFFDF9 0%, #FAF5EB 70%, #F5ECE0 100%);
      opacity: 1;
      visibility: visible;
      transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), transform 0.65s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.65s;
      pointer-events: auto;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    #kms-preloader.kms-loaded {
      opacity: 0;
      transform: scale(1.035);
      visibility: hidden;
      pointer-events: none;
    }

    .kms-loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
      position: relative;
      z-index: 2;
    }

    .kms-loader-emblem {
      position: relative;
      width: 136px;
      height: 136px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.35rem;
    }

    .kms-loader-glow {
      position: absolute;
      width: 148px;
      height: 148px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.22) 0%, rgba(176, 138, 80, 0.08) 50%, rgba(252, 250, 246, 0) 75%);
      pointer-events: none;
      animation: celestialAura 2.6s ease-in-out infinite;
    }

    .kms-mandala-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 4px 14px rgba(56, 37, 29, 0.08));
    }

    .kms-orbit-outer {
      transform-origin: 80px 80px;
      animation: celestialSpinClockwise 24s linear infinite;
    }

    .kms-orbit-middle {
      transform-origin: 80px 80px;
      animation: celestialSpinCounter 16s linear infinite;
    }

    .kms-orbit-center {
      transform-origin: 80px 80px;
      animation: celestialPulse 2.4s ease-in-out infinite;
    }

    @keyframes celestialSpinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes celestialSpinCounter {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    @keyframes celestialPulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 6px rgba(176, 138, 80, 0.45));
      }
      50% {
        transform: scale(1.08);
        filter: drop-shadow(0 0 16px rgba(212, 175, 55, 0.8));
      }
    }

    @keyframes celestialAura {
      0%, 100% { transform: scale(0.95); opacity: 0.6; }
      50% { transform: scale(1.18); opacity: 1; }
    }

    .kms-loader-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }

    .kms-loader-title-ta {
      font-family: 'Noto Sans Tamil', -apple-system, sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: #38251D;
      letter-spacing: 0.02em;
      line-height: 1.25;
    }

    .kms-loader-title-en {

    .kms-loader-line {

    .kms-loader-diamond {

    .kms-loader-progress {

      overflow: hidden;
      margin-top: 1.25rem;

    .kms-loader-bar {

      background: linear-gradient(90deg, transparent, #B08A50, #D4AF37, transparent);

      position: absolute;

      left: -60%;

  <!-- KMS Sacred Celestial Preloader Failsafe Dismissal -->
  <script>
    (function() {
      window.__kmsLoaderStartTime = Date.now();
      var dismissed = false;
      function dismissPreloader() {
        if (dismissed) return;
        dismissed = true;
        var el = document.getElementById('kms-preloader');
        if (el) {
          el.classList.add('kms-loaded');
          setTimeout(function() {
            if (el && el.parentNode) {
              el.parentNode.removeChild(el);
            }
          }, 650);
        }
      }
      window.__kmsDismissPreloader = dismissPreloader;
      // Absolute failsafe: Never let preloader stay visible longer than 2000ms
      setTimeout(dismissPreloader, 2000);
    })();
  </script>
